name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
          components: rustfmt,clippy
    - name: Check formatting
      run: cargo fmt -- --check
    - name: Check linting
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Check linting (no features)
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --all-features
    - name: Run tests
      run: cargo test --all-features
    - name: Run tests (no features)
      run: cargo test
    - name: Docs
      run: cargo doc --all-features --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
          # Keep 1.66 in sync with `rust-version` in Cargo.toml
          toolchain: stable, 1.66
          # Only check that it builds, newer lints are covered by the main job
          rustflags: ""
    # There is no committed lockfile, and Cargo 1.66 would resolve to the latest
    # dependency versions, which may need a newer compiler. Resolve the library's
    # own dependencies (dev-dependencies aren't needed to check the library) to
    # the newest versions that still support `rust-version`.
    - name: Resolve MSRV-compatible dependencies
      run: |
        cargo +stable remove --dev criterion tokio
        cargo +stable update
      env:
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    - name: Check (no features)
      run: cargo +1.66 check --lib --locked
    - name: Check (all features)
      run: cargo +1.66 check --lib --all-features --locked

  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check semver compatibility with the latest published version
      uses: obi1kenobi/cargo-semver-checks-action@v2
